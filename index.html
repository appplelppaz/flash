<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Flashcards</title>
<meta name="description" content="Netflix 字幕から作った語彙リストで学べる、スワイプ操作のフラッシュカード">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="単語帳">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true">
  <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.7 7.7 0 0 0-1.7-1L15 2.5H9l-.4 2.5a7.7 7.7 0 0 0-1.7 1l-2.3-.9-2 3.4L4.6 11a7.6 7.6 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9c.5.4 1.1.8 1.7 1l.4 2.5h6l.4-2.5c.6-.2 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.5Z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 4.5v15M16 4.5v15"/></symbol>
  <symbol id="i-sound-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></symbol>
  <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9.5 4 5m0-5-4 5"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9L12 3.5Z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 13 4.5 4.5L19 7"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14"/></symbol>
</svg>

<main id="app">

<!-- ホーム ------------------------------------------------------------- -->
<section class="view" id="view-home" data-view="home">
  <header class="topbar">
    <h1 class="title">単語帳</h1>
    <button class="icon" id="btn-settings" aria-label="設定"><svg><use href="#i-gear"/></svg></button>
  </header>
  <div class="scroll">
    <div class="totals" id="home-totals"></div>
    <h2 class="section-label">リスト</h2>
    <div class="decklist" id="decklist"></div>
    <p class="foot-note">Netflix の字幕から作った TSV は ＋ から取り込めます。</p>
  </div>
  <button class="fab" id="btn-import" aria-label="リストを取り込む"><svg><use href="#i-plus"/></svg></button>
</section>

<!-- リスト（学習の準備）------------------------------------------------ -->
<section class="view" id="view-deck" data-view="deck">
  <header class="topbar">
    <button class="icon" data-back aria-label="戻る"><svg><use href="#i-back"/></svg></button>
    <h1 class="title" id="deck-title">—</h1>
    <button class="icon" id="btn-deck-cards" aria-label="単語一覧"><svg><use href="#i-list"/></svg></button>
  </header>
  <div class="scroll">
    <div class="deck-head">
      <div class="ring" id="deck-ring"></div>
      <div class="deck-nums" id="deck-nums"></div>
    </div>

    <h2 class="section-label">出題する範囲</h2>
    <div class="segmented" id="scope-picker">
      <button data-scope="new" class="on">未学習</button>
      <button data-scope="weak">苦手</button>
      <button data-scope="fav">★</button>
      <button data-scope="all">すべて</button>
    </div>

    <h2 class="section-label">1 セットの語数</h2>
    <div class="stepper">
      <button id="size-minus" aria-label="減らす">−</button>
      <output id="size-value">20</output>
      <button id="size-plus" aria-label="増やす">＋</button>
    </div>
    <div class="chips" id="size-presets">
      <button data-size="10">10</button>
      <button data-size="20">20</button>
      <button data-size="30">30</button>
      <button data-size="50">50</button>
      <button data-size="100">100</button>
    </div>

    <div class="row-actions">
      <button class="ghost" id="btn-deck-reset">進み具合をリセット</button>
      <button class="ghost danger" id="btn-deck-delete">リストを削除</button>
    </div>
  </div>
  <div class="bottom-bar">
    <button class="primary" id="btn-start"><svg><use href="#i-play"/></svg><span id="start-label">学習を始める</span></button>
  </div>
</section>

<!-- 単語一覧 ----------------------------------------------------------- -->
<section class="view" id="view-cards" data-view="cards">
  <header class="topbar">
    <button class="icon" data-back aria-label="戻る"><svg><use href="#i-back"/></svg></button>
    <h1 class="title" id="cards-title">単語一覧</h1>
    <button class="icon" id="btn-export-tsv" aria-label="TSV を書き出す"><svg><use href="#i-download"/></svg></button>
  </header>
  <div class="searchbar">
    <svg class="search-icon"><use href="#i-search"/></svg>
    <input type="search" id="cards-search" placeholder="単語・訳・例文を検索" autocomplete="off">
  </div>
  <div class="segmented small" id="cards-filter">
    <button data-filter="all" class="on">すべて</button>
    <button data-filter="new">未学習</button>
    <button data-filter="learned">学習済み</button>
    <button data-filter="weak">苦手</button>
    <button data-filter="fav">★</button>
  </div>
  <div class="scroll" id="cards-scroll">
    <div class="wordlist" id="wordlist"></div>
    <div class="more" id="cards-more" hidden><button class="ghost" id="btn-cards-more">もっと見る</button></div>
  </div>
</section>

<!-- 取り込み ----------------------------------------------------------- -->
<section class="view" id="view-import" data-view="import">
  <header class="topbar">
    <button class="icon" data-back aria-label="戻る"><svg><use href="#i-back"/></svg></button>
    <h1 class="title">リストを取り込む</h1>
    <span class="icon spacer"></span>
  </header>
  <div class="scroll">
    <p class="lead">
      1 行 1 語、タブ区切りで 4 列。<br>
      <code>単語 ⇥ 日本語訳 ⇥ 例文 ⇥ 例文の日本語訳</code>
    </p>

    <label class="field">
      <span>リスト名</span>
      <input type="text" id="import-name" placeholder="例：ペーパーハウス S1" autocomplete="off">
    </label>

    <label class="field">
      <span>言語</span>
      <select id="import-lang"></select>
    </label>

    <div class="dropzone" id="dropzone">
      <input type="file" id="import-file" accept=".tsv,.txt,.csv" hidden>
      <button class="ghost" id="btn-pick-file">ファイルを選ぶ</button>
      <span class="or">または下に貼り付け</span>
    </div>

    <textarea id="import-text" class="paste" rows="8" spellcheck="false"
      placeholder="ここに TSV を貼り付け"></textarea>

    <div class="import-status" id="import-status"></div>
    <div class="preview" id="import-preview"></div>
  </div>
  <div class="bottom-bar">
    <button class="primary" id="btn-import-go" disabled><svg><use href="#i-check"/></svg><span>取り込む</span></button>
  </div>
</section>

<!-- 学習 --------------------------------------------------------------- -->
<section class="view study" id="view-study" data-view="study">
  <div class="study-top">
    <button class="icon ghosty" id="btn-quit" aria-label="やめる"><svg><use href="#i-close"/></svg></button>
    <div class="setbar"><i id="setbar-fill"></i></div>
    <div class="study-count" id="study-count">0</div>
  </div>

  <div class="stage" id="stage">
    <div class="swipe-cue cue-up"><svg><use href="#i-check"/></svg></div>
    <div class="swipe-cue cue-down"><svg><use href="#i-close"/></svg></div>
    <article class="card" id="card" tabindex="0" aria-live="polite">
      <div class="card-inner">
        <div class="line term" id="line-term"></div>
        <div class="line reading" id="line-reading"></div>
        <div class="line meaning" id="line-meaning"></div>
        <div class="line example" id="line-example"></div>
        <div class="line example-ja" id="line-example-ja"></div>
        <div class="line links" id="line-links"></div>
      </div>
      <div class="paused-mark" id="paused-mark"><svg><use href="#i-play"/></svg></div>
    </article>
  </div>

  <div class="study-bottom">
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="icon ghosty" id="btn-fav" aria-label="お気に入り"><svg><use href="#i-star"/></svg></button>
      <button class="icon ghosty" id="btn-pause" aria-label="一時停止"><svg><use href="#i-pause"/></svg></button>
      <button class="icon ghosty" id="btn-sound" aria-label="読み上げ"><svg><use href="#i-sound-on"/></svg></button>
    </div>
    <div class="timer"><i id="timer-fill"></i></div>
  </div>

  <div class="coach" id="coach" hidden>
    <div class="coach-box">
      <h2>指の操作</h2>
      <ul>
        <li><b>タップ</b><span>次を表示</span></li>
        <li><b>長押し</b><span>一時停止 / 再開</span></li>
        <li><b>上へスワイプ</b><span>覚えた</span></li>
        <li><b>下へスワイプ</b><span>まだ</span></li>
        <li><b>左へスワイプ</b><span>次の単語へ</span></li>
        <li><b>右へスワイプ</b><span>前の単語へ</span></li>
      </ul>
      <button class="primary" id="btn-coach-ok">はじめる</button>
    </div>
  </div>
</section>

<!-- 結果 --------------------------------------------------------------- -->
<section class="view" id="view-result" data-view="result">
  <div class="scroll center">
    <div class="result-mark"><svg><use href="#i-check"/></svg></div>
    <h1 class="result-title" id="result-title">おつかれさま</h1>
    <div class="result-grid" id="result-grid"></div>
  </div>
  <div class="bottom-bar two">
    <button class="ghost" id="btn-result-home">リストへ</button>
    <button class="primary" id="btn-result-again">続ける</button>
  </div>
</section>

<!-- 設定 --------------------------------------------------------------- -->
<section class="view" id="view-settings" data-view="settings">
  <header class="topbar">
    <button class="icon" data-back aria-label="戻る"><svg><use href="#i-back"/></svg></button>
    <h1 class="title">設定</h1>
    <span class="icon spacer"></span>
  </header>
  <div class="scroll">
    <h2 class="section-label">見た目</h2>
    <div class="segmented" id="theme-picker">
      <button data-theme="auto" class="on">端末に合わせる</button>
      <button data-theme="light">ライト</button>
      <button data-theme="dark">ダーク</button>
    </div>

    <h2 class="section-label">出題</h2>
    <label class="field row">
      <span>出題の順番</span>
      <select id="set-order">
        <option value="listed">リストの順</option>
        <option value="random">ランダム</option>
        <option value="weak-first">苦手を先に</option>
      </select>
    </label>
    <label class="field row">
      <span>出す順番</span>
      <select id="set-direction">
        <option value="example-first">例文 → 単語 → 訳</option>
        <option value="term-first">単語 → 訳 → 例文</option>
        <option value="meaning-first">訳 → 単語 → 例文</option>
      </select>
    </label>
    <label class="switch">
      <span>例文の訳も表示する</span>
      <input type="checkbox" id="set-show-example-ja">
      <i></i>
    </label>
    <label class="switch">
      <span>例文のおまけの語も覚える</span>
      <input type="checkbox" id="set-links" checked>
      <i></i>
    </label>

    <h2 class="section-label">読み上げ</h2>
    <label class="switch">
      <span>読み上げる</span>
      <input type="checkbox" id="set-tts" checked>
      <i></i>
    </label>
    <label class="field row">
      <span>読み上げる範囲</span>
      <select id="set-tts-plan">
        <option value="full">すべて（例文の訳も）</option>
        <option value="short">例文の訳はとばす</option>
        <option value="target">現地語だけ</option>
        <option value="word">単語だけ</option>
      </select>
    </label>
    <label class="field row">
      <span>速さ <output id="rate-out">1.0</output></span>
      <input type="range" id="set-rate" min="0.5" max="1.6" step="0.05" value="1">
    </label>
    <div id="voice-fields"></div>

    <h2 class="section-label">自動めくり・自動送り</h2>
    <label class="switch">
      <span>自動めくり（次の表示へ）</span>
      <input type="checkbox" id="set-auto-flip" checked>
      <i></i>
    </label>
    <label class="field row">
      <span>めくるまで <output id="flip-delay-out">1.0 秒</output></span>
      <input type="range" id="set-flip-delay" min="0.5" max="10" step="0.5" value="1">
    </label>
    <label class="switch">
      <span>自動送り（次の単語へ）</span>
      <input type="checkbox" id="set-auto-next" checked>
      <i></i>
    </label>
    <label class="field row">
      <span>送るまで <output id="next-delay-out">1.5 秒</output></span>
      <input type="range" id="set-next-delay" min="0.5" max="10" step="0.5" value="1.5">
    </label>

    <h2 class="section-label">データ</h2>
    <div class="row-actions column">
      <button class="ghost" id="btn-backup">バックアップを書き出す</button>
      <button class="ghost" id="btn-restore">バックアップを読み込む</button>
      <input type="file" id="restore-file" accept=".json" hidden>
      <button class="ghost" id="btn-coach-again">指の操作をもう一度見る</button>
      <button class="ghost danger" id="btn-wipe">すべて消す</button>
    </div>
    <p class="foot-note" id="storage-note"></p>
  </div>
</section>

</main>

<div class="toast" id="toast" hidden></div>

<script src="js/tsv.js"></script>
<script src="js/store.js"></script>
<script src="js/session.js"></script>
<script src="js/library.js"></script>
<script src="js/speech.js"></script>
<script src="js/links.js"></script>
<script src="js/gesture.js"></script>
<script src="js/app.js"></script>
</body>
</html>
