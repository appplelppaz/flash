<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="description" content="言語ごとの単語帳から任意の語数を選び、すべて学習済みになるまで繰り返すフラッシュカードアプリ">
  <title>Flashcards</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230b0b0d'/><rect x='8' y='10' width='16' height='12' rx='2.5' fill='none' stroke='white' stroke-width='2'/></svg>">
</head>
<body>
  <header class="topbar">
    <button type="button" class="icon-btn" id="back-btn" aria-label="戻る">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <p class="topbar-title" id="topbar-title">Flashcards</p>
    <button type="button" class="icon-btn" id="settings-btn" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
    </button>
  </header>

  <main id="main">
    <!-- ホーム -->
    <section class="screen" id="screen-home">
      <div class="stat-strip">
        <div class="stat"><span class="stat-value" id="stat-learned">0</span><span class="stat-label">学習済み</span></div>
        <div class="stat"><span class="stat-value" id="stat-streak">0</span><span class="stat-label">連続日数</span></div>
        <div class="stat"><span class="stat-value" id="stat-accuracy">—</span><span class="stat-label">正答率</span></div>
      </div>

      <ul class="deck-list" id="deck-list"></ul>
    </section>

    <!-- デッキ（出題設定） -->
    <section class="screen" id="screen-deck" hidden>
      <div class="deck-head">
        <span class="code-chip" id="deck-code">EN</span>
        <div>
          <h2 id="deck-name">英語</h2>
          <p class="muted" id="deck-sub">0 / 0 語 学習済み</p>
        </div>
      </div>

      <div class="meter"><span id="deck-meter-fill"></span></div>

      <div class="block">
        <label class="block-label" for="list-select">単語リスト</label>
        <select id="list-select"></select>
      </div>

      <div class="block">
        <p class="block-label">出題する範囲</p>
        <div class="segmented" id="scope-group" role="group">
          <button type="button" data-scope="all" class="seg is-active">すべて</button>
          <button type="button" data-scope="weak" class="seg">苦手のみ</button>
          <button type="button" data-scope="fav" class="seg">★ のみ</button>
        </div>
        <p class="hint" id="scope-hint"></p>
      </div>

      <div class="block">
        <p class="block-label">出題する単語数</p>
        <div class="stepper">
          <button type="button" class="step" id="count-minus" aria-label="1 減らす">−</button>
          <input type="number" id="deck-word-count" min="1" step="1" inputmode="numeric" aria-label="出題する単語数">
          <button type="button" class="step" id="count-plus" aria-label="1 増やす">＋</button>
        </div>
        <div class="chips" id="count-presets">
          <button type="button" class="chip" data-count="10">10</button>
          <button type="button" class="chip" data-count="20">20</button>
          <button type="button" class="chip" data-count="30">30</button>
          <button type="button" class="chip" data-count="all">すべて</button>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="start-btn">学習を開始</button>
        <button type="button" class="btn" id="open-list-btn">単語一覧・編集</button>
      </div>
    </section>

    <!-- 学習（アイコンだけの全画面レイアウト・横画面前提） -->
    <section class="screen screen-study" id="screen-study" hidden>
      <div class="study-bar">
        <button type="button" class="ibtn" id="study-back-btn" aria-label="学習をやめる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="meter"><span id="study-meter-fill"></span></div>
        <button type="button" class="ibtn" id="speak-btn" aria-label="もう一度聞く">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12L7.5 14.5H4z"/><path d="M16 9.2a4 4 0 010 5.6"/><path d="M18.6 6.6a7.5 7.5 0 010 10.8"/></svg>
        </button>
        <button type="button" class="ibtn" id="auto-btn" aria-pressed="true" aria-label="自動送り"></button>
        <button type="button" class="ibtn" id="fav-btn" aria-pressed="false" aria-label="お気に入り">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.6 9.7l5.8-.8z"/></svg>
        </button>
      </div>

      <!-- スワイプを受け取る面。アイコンの位置がそのままスワイプの向きになる -->
      <div class="study-body" id="study-body">
        <button type="button" class="edge" id="prev-word-btn" aria-label="前の単語に戻る">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>

        <div class="stack">
          <button type="button" class="mark mark-correct" id="correct-btn" aria-label="わかった">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>
          </button>

          <div class="card" id="card" role="button" tabindex="0" aria-label="次を表示">
            <div class="card-steps" id="card-steps"></div>
            <div class="card-dots" id="card-dots" aria-hidden="true"></div>
          </div>

          <button type="button" class="mark mark-wrong" id="wrong-btn" aria-label="わからなかった">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
          </button>
        </div>

        <button type="button" class="edge" id="next-word-btn" aria-label="次の単語に進む">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>

      <div class="card-timer" id="card-timer" hidden><span id="card-timer-fill"></span></div>
    </section>

    <!-- 結果 -->
    <section class="screen" id="screen-result" hidden>
      <div class="result-head">
        <p class="result-mark">✓</p>
        <h2>すべて学習済みになりました</h2>
        <p class="muted" id="result-sub"></p>
      </div>
      <dl class="rows">
        <div><dt>学習した単語</dt><dd id="result-total">-</dd></div>
        <div><dt>解答回数</dt><dd id="result-answered">-</dd></div>
        <div><dt>正答率</dt><dd id="result-accuracy">-</dd></div>
        <div><dt>所要時間</dt><dd id="result-time">-</dd></div>
        <div><dt>連続学習日数</dt><dd id="result-streak">-</dd></div>
      </dl>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="again-btn">同じ設定でもう一度</button>
        <button type="button" class="btn" id="result-home-btn">ホームに戻る</button>
      </div>
    </section>

    <!-- 単語一覧 -->
    <section class="screen" id="screen-list" hidden>
      <div class="search-row">
        <input type="search" id="search-input" placeholder="単語・意味で検索" aria-label="単語を検索">
      </div>
      <div class="chips" id="filter-chips">
        <button type="button" class="chip is-active" data-filter="all">すべて</button>
        <button type="button" class="chip" data-filter="unlearned">未学習</button>
        <button type="button" class="chip" data-filter="learned">学習済み</button>
        <button type="button" class="chip" data-filter="weak">苦手</button>
        <button type="button" class="chip" data-filter="fav">★</button>
      </div>
      <p class="hint" id="list-count"></p>
      <ul class="word-list" id="word-list"></ul>
      <button type="button" class="btn" id="list-more-btn" hidden>さらに表示</button>
      <button type="button" class="btn btn-primary sticky-add" id="add-word-btn">＋ 単語を追加</button>
    </section>

    <!-- 単語の追加・編集 -->
    <section class="screen" id="screen-edit" hidden>
      <h2 class="screen-title" id="edit-title">単語を追加</h2>
      <div class="block">
        <label class="block-label" for="edit-term">単語</label>
        <input type="text" id="edit-term" autocomplete="off">
      </div>
      <div class="block">
        <label class="block-label" for="edit-reading">読み・発音（任意）</label>
        <input type="text" id="edit-reading" autocomplete="off">
      </div>
      <div class="block">
        <label class="block-label" for="edit-meaning">日本語訳</label>
        <input type="text" id="edit-meaning" autocomplete="off">
      </div>
      <div class="block">
        <label class="block-label" for="edit-example">例文（任意）</label>
        <input type="text" id="edit-example" autocomplete="off">
      </div>
      <div class="block">
        <label class="block-label" for="edit-example-ja">例文の日本語訳（任意）</label>
        <input type="text" id="edit-example-ja" autocomplete="off">
      </div>
      <p class="hint error" id="edit-error"></p>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="edit-save-btn">保存</button>
        <button type="button" class="btn btn-danger" id="edit-delete-btn" hidden>この単語を削除</button>
      </div>
    </section>

    <!-- 設定 -->
    <section class="screen" id="screen-settings" hidden>
      <div class="block">
        <label class="block-label" for="set-word-count">出題する単語数</label>
        <input type="number" id="set-word-count" min="1" max="500" step="1" inputmode="numeric">
      </div>

      <div class="block">
        <label class="block-label" for="set-streak">学習済みと判定する連続正解回数</label>
        <input type="number" id="set-streak" min="1" max="10" step="1" inputmode="numeric">
      </div>

      <div class="block">
        <label class="block-label" for="set-direction">出題の向き</label>
        <select id="set-direction">
          <option value="term-first">単語 → 意味</option>
          <option value="meaning-first">意味 → 単語</option>
          <option value="mixed">ランダム</option>
        </select>
      </div>

      <div class="block">
        <label class="block-label" for="set-order">単語の選び方</label>
        <select id="set-order">
          <option value="unlearned-first">未学習・苦手を優先</option>
          <option value="random">ランダム</option>
          <option value="weak-first">間違えた回数が多い順</option>
        </select>
      </div>

      <div class="block">
        <label class="block-label" for="set-theme">テーマ</label>
        <select id="set-theme">
          <option value="auto">端末に合わせる</option>
          <option value="light">ライト</option>
          <option value="dark">ダーク</option>
        </select>
      </div>

      <div class="block toggle-row">
        <label class="block-label" for="set-speech">読み上げを自動再生する</label>
        <input type="checkbox" id="set-speech" class="switch">
      </div>
      <div class="block toggle-row">
        <label class="block-label" for="set-auto">自動送り</label>
        <input type="checkbox" id="set-auto" class="switch">
      </div>
      <div class="block">
        <label class="block-label" for="set-auto-seconds">自動送りの間隔（秒）</label>
        <input type="number" id="set-auto-seconds" min="0.5" max="20" step="0.5" inputmode="decimal">
        <p class="hint">読み上げが終わってから、次の表示に移るまでの秒数（0.5 〜 20）。</p>
      </div>

      <div class="block">
        <p class="block-label">データ</p>
        <div class="actions">
          <button type="button" class="btn" id="export-btn">バックアップを書き出す</button>
          <button type="button" class="btn" id="import-btn">バックアップを読み込む</button>
          <button type="button" class="btn btn-danger" id="reset-btn">学習進捗をリセット</button>
        </div>
        <input type="file" id="import-file" accept="application/json" hidden>
        <p class="hint" id="data-hint"></p>
      </div>

      <button type="button" class="btn btn-primary" id="settings-done-btn">保存して戻る</button>
    </section>
  </main>

  <script src="js/data/en-eiken1.js"></script>
  <script src="js/data/zh-hsk69.js"></script>
  <script src="js/data/es-vida3000.js"></script>
  <script src="js/data/fr-vie3000.js"></script>
  <script src="js/decks.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/session.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
